<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/images/logo.png" alt="MiraPay Logo" class="auth-logo">
      <h2>{{ts.translate('AUTH.LOGIN_TITLE')}}</h2>
      <p>{{ts.translate('AUTH.LOGIN_SUBTITLE')}}</p>
    </div>

    @if (errorMessage) {
      <div class="auth-error">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="identifier">{{ts.translate('AUTH.EMAIL_OR_USERNAME')}}</label>
        <input 
          type="text" 
          id="identifier" 
          name="identifier" 
          [(ngModel)]="credentials.emailOrUsername" 
          required
          class="form-control"
          [placeholder]="ts.translate('AUTH.EMAIL_PLACEHOLDER')"
        />
      </div>

      <div class="form-group">
        <label for="password">{{ts.translate('AUTH.PASSWORD')}}</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="credentials.password" 
          required
          class="form-control"
          [placeholder]="ts.translate('AUTH.PASSWORD_PLACEHOLDER')"
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="!loginForm.form.valid || isLoading">
        {{ isLoading ? ts.translate('AUTH.CONNECTING') : ts.translate('AUTH.CONNECT_BTN') }}
      </button>
    </form>

    <div class="auth-footer">
      <p>{{ts.translate('AUTH.NO_ACCOUNT')}} <a routerLink="/register">{{ts.translate('AUTH.REGISTER_HERE')}}</a>.</p>
    </div>
  </div>
</div>
