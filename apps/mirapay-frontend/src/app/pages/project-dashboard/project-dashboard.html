<div class="dashboard-container">
  @if (isModalOpen()) {
    <app-project-edit-dlg
      [clients]="clients()"
      [projectToEdit]="projectToEdit()"
      (closeDialog)="isModalOpen.set(false)"
      (saveProject)="onSaveProject($event)"
    ></app-project-edit-dlg>
  }
  
  <header class="dashboard-header">
    @if (!embedded) {
      <div class="title-section">
        <h1>{{ ts.translate('PROJECTS.KANBAN_TITLE') }}</h1>
        <p class="subtitle">{{ ts.translate('PROJECTS.KANBAN_SUBTITLE') }}</p>
      </div>
    }

    <!-- Barre d'outils et Filtres -->
    <div class="toolbar" [style.justify-content]="embedded ? 'flex-end' : 'space-between'">
      <div class="filter-group search-bar">
        <span class="icon">🔍</span>
        <input 
          type="text" 
          [placeholder]="ts.translate('PROJECTS.SEARCH_PLACEHOLDER')" 
          [value]="searchQuery()" 
          (input)="updateSearch($event)"
        >
      </div>

      <div class="filter-group">
        <select [value]="selectedClientId()" (change)="updateClientFilter($event)">
          <option value="">{{ ts.translate('PROJECTS.ALL_CLIENTS') }}</option>
          @for (client of clients(); track client.id) {
            <option [value]="client.id">{{ client.nomLegal }}</option>
          }
        </select>
      </div>

      @if (!embedded) {
        <button class="btn-primary" (click)="openModal()">
          + {{ ts.translate('PROJECTS.NEW_PROJECT') }}
        </button>
      }
    </div>
  </header>

  @if (isLoading()) {
    <div class="loading-state">{{ ts.translate('COMMON.LOADING') }}</div>
  } @else {
    <!-- Conteneur du Kanban Board -->
    <div class="kanban-board">
      @for (col of columns; track col.statusKey) {
        <app-kanban-column
          [title]="ts.translate(col.titleKey)"
          [statusKey]="col.statusKey"
          [projects]="groupedProjects()[col.statusKey].projects"
          [totalBudget]="groupedProjects()[col.statusKey].totalBudget"
          (projectDropped)="onProjectDropped($event)"
        ></app-kanban-column>
      }
    </div>
  }
</div>
