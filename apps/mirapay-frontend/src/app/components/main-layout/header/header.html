<header class="app-header">
  <div class="header-left">
    <div class="logo-container">
      <img src="/images/logo.png" alt="MiraPay Logo" class="logo-img">
      <span class="logo-text">MiraPay</span>
    </div>
  </div>
  <div class="header-right">
    <div class="language-selector">
      <select [value]="ts.getLanguage()" (change)="onLangChange($event)">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
      </select>
    </div>
    <div class="notifications">
      <span class="icon">🔔</span>
    </div>
    <div class="user-profile">
      <span class="user-name" *ngIf="auth.currentUser() as user; else guest">{{ user.firstName }} {{ user.lastName }}</span>
      <ng-template #guest>
        <span class="user-name">Invité</span>
      </ng-template>
      <img src="/images/user_avatar.png" alt="JD" class="avatar-img">
    </div>
  </div>
</header>
